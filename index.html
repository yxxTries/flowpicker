<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowpicker</title>

  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }
    })();
  </script>

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/features/table/table.css" />
  <link rel="stylesheet" href="src/features/warnings/warnings.css" />
  <link rel="stylesheet" href="src/features/modal/modal.css" />
  <link rel="stylesheet" href="src/features/browse-menu/browse-menu.css" />
  <link rel="stylesheet" href="src/features/export/export.css" />
  <link rel="stylesheet" href="src/features/list-id/list-id.css" />
  <link rel="stylesheet" href="src/features/stack-analysis/stack-analysis.css" />
  <link rel="stylesheet" href="src/features/auth/auth.css" />
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a href="/" class="brand">Flowpicker</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" class="active" aria-current="page">Plan</a>
        <a href="browse.html" id="browse-link">Browse</a>
      </nav>
      <nav class="browse-menu browse-menu-preview" aria-label="Layers" aria-hidden="true" hidden>
        <button type="button" class="browse-menu-item" data-layer="ide" style="--i:0" tabindex="-1">IDE / Editor</button>
        <button type="button" class="browse-menu-item" data-layer="llm" style="--i:1" tabindex="-1">LLM Provider / Model</button>
        <button type="button" class="browse-menu-item" data-layer="integration" style="--i:2" tabindex="-1">Integration</button>
        <button type="button" class="browse-menu-item" data-layer="context" style="--i:3" tabindex="-1">Context / RAG</button>
        <button type="button" class="browse-menu-item" data-layer="agent" style="--i:4" tabindex="-1">Agent / Orchestration</button>
      </nav>
      <div id="auth-header-slot"></div>
      <button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>
    <p class="tagline">Pick an IDE, model, integrations, and more — get instant compatibility warnings, cost estimates, and a shareable stack.</p>

    <details id="warning-banner" class="warning-banner" hidden>
      <summary class="warning-summary">
        <span class="warning-icon" aria-hidden="true">!</span>
        <span class="warning-headline" id="warning-headline">Compatibility issues</span>
        <span class="warning-toggle-hint">click to expand</span>
      </summary>
      <ul id="warning-list" class="warning-list"></ul>
    </details>

    <div class="table-toolbar">
      <div class="list-url-bar">
        <span class="list-url-label">List URL</span>
        <input id="list-url-field" class="list-url-field" type="text" aria-label="Permanent link to this list" />
        <button type="button" id="list-url-copy" class="list-url-copy" aria-label="Copy link" title="Copy link">
          <svg id="list-copy-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <svg id="list-check-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </button>
      </div>
      <div id="export-toolbar" class="export-toolbar">
        <button type="button" id="share-btn" class="toolbar-btn is-primary" title="Copy a link to this list">
          <span aria-hidden="true">🔗</span>
          <span>Share</span>
        </button>
        <button type="button" id="export-btn" class="toolbar-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="export-menu">
          <span>Export</span>
          <span class="toolbar-btn-caret" aria-hidden="true">▾</span>
        </button>
        <div id="export-menu" class="export-menu" role="menu" hidden>
          <button type="button" class="export-menu-item" role="menuitem" data-format="markdown">
            <span>Markdown</span>
            <span class="export-menu-item-hint">Download .md — great for GitHub/Reddit</span>
          </button>
          <button type="button" class="export-menu-item" role="menuitem" data-format="copy-markdown">
            <span>Copy as Markdown</span>
            <span class="export-menu-item-hint">To clipboard</span>
          </button>
          <button type="button" class="export-menu-item" role="menuitem" data-format="csv">
            <span>CSV</span>
            <span class="export-menu-item-hint">Spreadsheet-friendly</span>
          </button>
          <button type="button" class="export-menu-item" role="menuitem" data-format="json">
            <span>JSON</span>
            <span class="export-menu-item-hint">Full attributes for re-import</span>
          </button>
          <button type="button" class="export-menu-item" role="menuitem" data-format="text">
            <span>Plain text</span>
            <span class="export-menu-item-hint">For Slack/email</span>
          </button>
        </div>
      </div>
      <button type="button" id="reset-btn" class="reset-btn" hidden>Reset all</button>
    </div>
    <div id="export-toast" class="export-toast" role="status" aria-live="polite" hidden></div>

    <table class="picker-table">
      <thead>
        <tr>
          <th class="col-layer">Layer</th>
          <th class="col-selection">Selection</th>
          <th class="col-cost">Cost</th>
          <th class="col-source">Source</th>
          <th class="col-complexity">Setup Complexity</th>
          <th class="col-provider">Provider</th>
          <th class="col-keyspecs">Key Specs</th>
          <th class="col-website">Where</th>
        </tr>
      </thead>
      <tbody id="picker-body"></tbody>
    </table>

    <section id="stack-analysis" class="stack-analysis" aria-label="Stack analysis" hidden></section>
  </main>

  <div id="auth-modal" class="auth-modal" hidden>
    <div class="auth-modal-backdrop"></div>
    <div class="auth-modal-panel"></div>
  </div>

  <div id="picker-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title">Pick an option</h2>
        <button type="button" class="modal-close" data-close="true" aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <div id="modal-cards" class="card-grid"></div>
      </div>
    </div>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="data/rules.js"></script>
  <script src="data/attribute-labels.js"></script>
  <script src="src/main.js"></script>
  <script src="src/db.js"></script>
  <script src="src/features/selections-store/selections-store.js"></script>
  <script src="src/features/darkmode/darkmode.js"></script>
  <script src="src/features/browse-menu/browse-menu-preview.js"></script>
  <script src="src/features/warnings/warnings.js"></script>
  <script src="src/features/table/table.js"></script>
  <script src="src/features/modal/modal.js"></script>
  <script src="src/features/export/export.js"></script>
  <script src="src/features/stack-analysis/stack-analysis.js"></script>
  <script src="src/features/list-id/list-id.js"></script>
  <script src="src/features/auth/auth.js"></script>
</body>
</html>
