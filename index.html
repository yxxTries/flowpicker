<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowpicker</title>

  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }
    })();
  </script>

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/features/table/table.css" />
  <link rel="stylesheet" href="src/features/warnings/warnings.css" />
  <link rel="stylesheet" href="src/features/modal/modal.css" />
  <link rel="stylesheet" href="src/features/browse-menu/browse-menu.css" />
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a href="/" class="brand">Flowpicker</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html" class="active" aria-current="page">Plan</a>
        <a href="browse.html" id="browse-link">Browse</a>
      </nav>
      <nav class="browse-menu browse-menu-preview" aria-label="Layers" aria-hidden="true" hidden>
        <button type="button" class="browse-menu-item" data-layer="ide" style="--i:0" tabindex="-1">IDE / Editor</button>
        <button type="button" class="browse-menu-item" data-layer="llm" style="--i:1" tabindex="-1">LLM Provider / Model</button>
        <button type="button" class="browse-menu-item" data-layer="integration" style="--i:2" tabindex="-1">Integration</button>
        <button type="button" class="browse-menu-item" data-layer="context" style="--i:3" tabindex="-1">Context / RAG</button>
        <button type="button" class="browse-menu-item" data-layer="agent" style="--i:4" tabindex="-1">Agent / Orchestration</button>
      </nav>
      <button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>
    <p class="tagline">Assemble your AI coding stack, layer by layer.</p>

    <details id="warning-banner" class="warning-banner" hidden>
      <summary class="warning-summary">
        <span class="warning-icon" aria-hidden="true">!</span>
        <span class="warning-headline" id="warning-headline">Compatibility issues</span>
        <span class="warning-toggle-hint">click to expand</span>
      </summary>
      <ul id="warning-list" class="warning-list"></ul>
    </details>

    <div class="table-toolbar">
      <button type="button" id="reset-btn" class="reset-btn" hidden>Reset all</button>
    </div>

    <table class="picker-table">
      <thead>
        <tr>
          <th class="col-layer">Layer</th>
          <th class="col-selection">Selection</th>
          <th class="col-cost">Cost</th>
          <th class="col-source">Source</th>
          <th class="col-complexity">Setup Complexity</th>
          <th class="col-provider">Provider</th>
          <th class="col-keyspecs">Key Specs</th>
        </tr>
      </thead>
      <tbody id="picker-body"></tbody>
    </table>
  </main>

  <div id="picker-modal" class="modal" hidden>
    <div class="modal-backdrop" data-close="true"></div>
    <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <header class="modal-header">
        <h2 id="modal-title">Pick an option</h2>
        <button type="button" class="modal-close" data-close="true" aria-label="Close">×</button>
      </header>
      <div class="modal-body">
        <div id="modal-cards" class="card-grid"></div>
      </div>
    </div>
  </div>

  <script src="vendor/sql-wasm.js"></script>
  <script src="data/rules.js"></script>
  <script src="data/attribute-labels.js"></script>
  <script src="src/main.js"></script>
  <script src="src/db.js"></script>
  <script src="src/features/selections-store/selections-store.js"></script>
  <script src="src/features/darkmode/darkmode.js"></script>
  <script src="src/features/browse-menu/browse-menu-preview.js"></script>
  <script src="src/features/warnings/warnings.js"></script>
  <script src="src/features/table/table.js"></script>
  <script src="src/features/modal/modal.js"></script>
</body>
</html>
