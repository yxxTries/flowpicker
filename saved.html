<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Saved – Flowpicker | AI Stack Builder</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://flowpicker.xyz/saved.html" />

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P6NNRR7E8G"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P6NNRR7E8G');
  </script>

  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }
    })();
  </script>

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/features/browse-menu/browse-menu.css" />
  <link rel="stylesheet" href="src/features/auth/auth.css" />
  <link rel="stylesheet" href="src/features/saved-flows/saved-flows.css" />
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a href="/" class="brand">Flowpicker</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Plan</a>
        <a href="browse.html" id="browse-link">Browse</a>
        <a href="templates.html">Templates</a>
        <a href="compare.html">Compare</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="saved.html" class="active" aria-current="page">Saved</a>
      </nav>
      <nav class="browse-menu browse-menu-preview" aria-label="Layers" aria-hidden="true" hidden>
        <button type="button" class="browse-menu-item" data-layer="ide" style="--i:0" tabindex="-1">IDE / Editor</button>
        <button type="button" class="browse-menu-item" data-layer="llm" style="--i:1" tabindex="-1">LLM Provider / Model</button>
        <button type="button" class="browse-menu-item" data-layer="integration" style="--i:2" tabindex="-1">Integration</button>
        <button type="button" class="browse-menu-item" data-layer="context" style="--i:3" tabindex="-1">Context / RAG</button>
        <button type="button" class="browse-menu-item" data-layer="agent" style="--i:4" tabindex="-1">Agent / Orchestration</button>
        <button type="button" class="browse-menu-item" data-layer="others" style="--i:5" tabindex="-1">Others</button>
      </nav>
      <div id="auth-header-slot"></div>
      <button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <p class="tagline">Your saved stacks.</p>
    <p class="tagline-note">Saved stacks live in this browser only, sign in to get user specific saved lists.</p>

    <div id="saved-container"></div>
  </main>

  <footer class="site-footer">
    <span>Flowpicker — AI coding stack builder. </span>
    <div class="site-footer-links">
      <a href="https://github.com/yxxTries" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="mailto:amil.shahul777@gmail.com">Email</a>
    </div>
  </footer>

  <div id="auth-modal" class="auth-modal" hidden>
    <div class="auth-modal-backdrop"></div>
    <div class="auth-modal-panel"></div>
  </div>

  <script>window.App = { features: {} };</script>
  <script src="src/features/selections-store/selections-store.js"></script>
  <script src="src/features/saved-flows/saved-flows.js"></script>
  <script src="src/features/darkmode/darkmode.js"></script>
  <script src="src/features/browse-menu/browse-menu-preview.js"></script>
  <script src="src/features/auth/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.features.darkmode.init();
      renderSaved();
      document.addEventListener('flowpicker:auth-changed', renderSaved);
    });

    function renderSaved() {
      const container = document.getElementById('saved-container');
      const user = window.FlowpickerAuth && window.FlowpickerAuth.getUser();
      const ownerKey = user ? user.email : '__local__';
      const flows = window.SavedFlows.listFor(ownerKey);

      if (flows.length === 0) {
        container.innerHTML = `
          <div class="saved-empty">
            <p>No saved stacks yet.</p>
            <p>Build one on the <a href="index.html">Plan</a> page, then click Save.</p>
          </div>`;
        return;
      }

      const fmt = (ts) => {
        const d = new Date(ts);
        return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      };

      container.innerHTML = `
        <ul class="saved-list">
          ${flows.map(f => `
            <li class="saved-item" data-id="${f.id}">
              <div class="saved-item-main">
                <div class="saved-item-name">${escapeHtml(f.name)}</div>
                <div class="saved-item-meta">Saved ${fmt(f.savedAt)}</div>
              </div>
              <div class="saved-item-actions">
                <button type="button" class="saved-item-btn" data-action="open">Open</button>
                <button type="button" class="saved-item-btn saved-item-btn--danger" data-action="delete" aria-label="Delete">Delete</button>
              </div>
            </li>
          `).join('')}
        </ul>`;

      container.querySelectorAll('.saved-item').forEach(li => {
        const id = li.dataset.id;
        li.querySelector('[data-action="open"]').addEventListener('click', () => {
          const flow = window.SavedFlows.get(ownerKey, id);
          if (!flow) return;
          window.SelectionsStore.save(flow.selections);
          window.location.href = 'index.html';
        });
        li.querySelector('[data-action="delete"]').addEventListener('click', () => {
          window.SavedFlows.remove(ownerKey, id);
          renderSaved();
        });
      });
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }
  </script>
</body>
</html>
