  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }

      // Pick up the in-flight nav-bar animation from Plan via sessionStorage.
      // We translate elapsed time into a negative animation-delay so the bar
      // appears mid-animation instead of restarting and flashing.
      const HANDOFF_KEY = 'flowpicker-browse-menu-shown-at';
      const shownAtRaw = sessionStorage.getItem(HANDOFF_KEY);
      if (shownAtRaw) {
        sessionStorage.removeItem(HANDOFF_KEY);
        const shownAt = Number(shownAtRaw);
        const elapsed = Date.now() - shownAt;
        if (Number.isFinite(elapsed) && elapsed >= 0 && elapsed < 5000) {
          document.documentElement.style.setProperty('--browse-menu-offset', `-${elapsed}ms`);
          document.documentElement.classList.add('browse-menu-handoff-ready');
        }
      }
    })();
  </script>

    <h1 class="tagline">Browse AI coding tools</h1>

    <div class="browse-mobile-toolbar" id="browse-mobile-toolbar">

      </button>
    </div>

    <div class="browse-layout">
      <aside class="browse-filters" id="browse-filters" aria-label="Filters">
        <div class="browse-filters-tabs" role="tablist">
          <button type="button" class="browse-filters-tab active" id="browse-tab-filters" role="tab" aria-selected="true" data-tab="filters">Filters</button>
          <button type="button" class="browse-filters-tab" id="browse-tab-sort" role="tab" aria-selected="false" data-tab="sort">Sort</button>
          <button type="button" class="browse-drawer-close" id="browse-drawer-close" aria-label="Close" hidden>×</button>
        </div>
        <p class="browse-filters-subtitle" id="browse-filters-subtitle" hidden></p>
        <div class="browse-filters-body" id="browse-filters-body"></div>
        <div class="browse-filters-body browse-sort-body" id="browse-sort-body" hidden></div>
        <div class="browse-drawer-footer" id="browse-drawer-footer" hidden>
          <button type="button" class="browse-drawer-clear" id="browse-drawer-clear">Clear all</button>
          <button type="button" class="browse-drawer-apply" id="browse-drawer-apply">Show results</button>
        </div>
      </aside>
      <div class="browse-drawer-backdrop" id="browse-drawer-backdrop" hidden></div>

      <section class="browse-results" aria-label="Results">
        <div class="browse-results-header">

          </div>
