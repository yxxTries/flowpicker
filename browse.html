<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Browse – Flowpicker</title>

  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }

      // Pick up the in-flight nav-bar animation from Plan via sessionStorage.
      // We translate elapsed time into a negative animation-delay so the bar
      // appears mid-animation instead of restarting and flashing.
      const HANDOFF_KEY = 'flowpicker-browse-menu-shown-at';
      const shownAtRaw = sessionStorage.getItem(HANDOFF_KEY);
      if (shownAtRaw) {
        sessionStorage.removeItem(HANDOFF_KEY);
        const shownAt = Number(shownAtRaw);
        const elapsed = Date.now() - shownAt;
        if (Number.isFinite(elapsed) && elapsed >= 0 && elapsed < 5000) {
          document.documentElement.style.setProperty('--browse-menu-offset', `-${elapsed}ms`);
          document.documentElement.classList.add('browse-menu-handoff-ready');
        }
      }
    })();
  </script>

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/features/browse-menu/browse-menu.css" />
  <link rel="stylesheet" href="src/features/browse-filters/browse-filters.css" />
  <link rel="stylesheet" href="src/features/modal/modal.css" />
  <link rel="stylesheet" href="src/features/auth/auth.css" />
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a href="/" class="brand">Flowpicker</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Plan</a>
        <a href="browse.html" class="active" aria-current="page">Browse</a>
        <a href="templates.html">Templates</a>
        <a href="saved.html">Saved</a>
      </nav>
      <nav class="browse-menu" aria-label="Layers">
        <button type="button" class="browse-menu-item active" data-layer="ide" style="--i:0">IDE / Editor</button>
        <button type="button" class="browse-menu-item" data-layer="llm" style="--i:1">LLM Provider / Model</button>
        <button type="button" class="browse-menu-item" data-layer="integration" style="--i:2">Integration</button>
        <button type="button" class="browse-menu-item" data-layer="context" style="--i:3">Context / RAG</button>
        <button type="button" class="browse-menu-item" data-layer="agent" style="--i:4">Agent / Orchestration</button>
      </nav>
      <div id="auth-header-slot"></div>
      <button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <p class="tagline">Explore all available tools and options.</p>

    <div class="browse-mobile-toolbar" id="browse-mobile-toolbar">
      <button type="button" class="browse-mobile-btn" id="browse-mobile-filters-btn" aria-haspopup="dialog" aria-expanded="false">
        <span aria-hidden="true">⚙</span>
        <span>Filters</span>
        <span class="browse-mobile-badge" id="browse-mobile-filters-badge" hidden>0</span>
      </button>
      <button type="button" class="browse-mobile-btn" id="browse-mobile-sort-btn" aria-haspopup="dialog" aria-expanded="false">
        <span aria-hidden="true">↕</span>
        <span>Sort</span>
      </button>
    </div>

    <div class="browse-layout">
      <aside class="browse-filters" id="browse-filters" aria-label="Filters">
        <div class="browse-filters-tabs" role="tablist">
          <button type="button" class="browse-filters-tab active" id="browse-tab-filters" role="tab" aria-selected="true" data-tab="filters">Filters</button>
          <button type="button" class="browse-filters-tab" id="browse-tab-sort" role="tab" aria-selected="false" data-tab="sort">Sort</button>
          <button type="button" class="browse-drawer-close" id="browse-drawer-close" aria-label="Close" hidden>×</button>
        </div>
        <p class="browse-filters-subtitle" id="browse-filters-subtitle" hidden></p>
        <div class="browse-filters-body" id="browse-filters-body"></div>
        <div class="browse-filters-body browse-sort-body" id="browse-sort-body" hidden></div>
        <div class="browse-drawer-footer" id="browse-drawer-footer" hidden>
          <button type="button" class="browse-drawer-clear" id="browse-drawer-clear">Clear all</button>
          <button type="button" class="browse-drawer-apply" id="browse-drawer-apply">Show results</button>
        </div>
      </aside>
      <div class="browse-drawer-backdrop" id="browse-drawer-backdrop" hidden></div>

      <section class="browse-results" aria-label="Results">
        <p class="browse-results-status" id="browse-results-status"></p>
        <div class="card-grid" id="browse-cards"></div>
      </section>
    </div>
  </main>

  <div id="auth-modal" class="auth-modal" hidden>
    <div class="auth-modal-backdrop"></div>
    <div class="auth-modal-panel"></div>
  </div>

  <script>window.App = { features: {} };</script>
  <script src="vendor/sql-wasm.js"></script>
  <script src="data/attribute-labels.js"></script>
  <script src="src/db.js"></script>
  <script src="src/features/selections-store/selections-store.js"></script>
  <script src="src/features/darkmode/darkmode.js"></script>
  <script src="src/features/browse-filters/browse-filters.js"></script>
  <script src="src/features/auth/auth.js"></script>
  <script>document.addEventListener('DOMContentLoaded', () => App.features.darkmode.init());</script>
</body>
</html>
