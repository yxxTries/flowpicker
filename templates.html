  <script>
    (() => {
      const saved = localStorage.getItem('flowpicker-dark-mode');
      const isDark = saved !== null ? saved === 'true' : true;
      if (isDark) {
        document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.backgroundColor = '#1a1a19';
      } else {
        document.documentElement.style.backgroundColor = '#fafaf9';
      }
    })();
  </script>

  <link rel="stylesheet" href="src/styles/tokens.css" />
  <link rel="stylesheet" href="src/styles/base.css" />

<body>
  <main class="page">
    <header class="site-header">
      <a href="/" class="brand">Flowpicker</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="index.html">Plan</a>
        <a href="browse.html" id="browse-link">Browse</a>
        <a href="templates.html" class="active" aria-current="page">Templates</a>
        <a href="compare.html">Compare</a>
        <a href="saved.html">Saved</a>
      </nav>
      <nav class="browse-menu browse-menu-preview" aria-label="Layers" aria-hidden="true" hidden>
        <button type="button" class="browse-menu-item" data-layer="ide" style="--i:0" tabindex="-1">IDE / Editor</button>
        <button type="button" class="browse-menu-item" data-layer="llm" style="--i:1" tabindex="-1">LLM Provider / Model</button>
        <button type="button" class="browse-menu-item" data-layer="integration" style="--i:2" tabindex="-1">Integration</button>
        <button type="button" class="browse-menu-item" data-layer="context" style="--i:3" tabindex="-1">Context / RAG</button>
        <button type="button" class="browse-menu-item" data-layer="agent" style="--i:4" tabindex="-1">Agent / Orchestration</button>
        <button type="button" class="browse-menu-item" data-layer="others" style="--i:5" tabindex="-1">Others</button>
      </nav>
      <div id="auth-header-slot"></div>
      <button type="button" id="dark-mode-toggle" class="dark-mode-toggle" aria-label="Toggle dark mode">🌙</button>
    </header>

    <h1 class="tagline">stack templates</h1>
    <p class="tagline-sub">Popular pre-built workflows. Click any template to load it into the stack planner and customize it.</p>

    <div class="templates-toolbar">
      <label class="templates-sort">
        <span class="templates-sort-label">Sort</span>
        <select id="templates-sort-select" class="templates-sort-select" aria-label="Sort templates">
          <option value="popularity">Popularity</option>
          <option value="name">Name (A–Z)</option>
          <option value="price-asc">Price (low to high)</option>
          <option value="price-desc">Price (high to low)</option>
        </select>
      </label>
    </div>

    <div id="templates-container"></div>
    <noscript>
      <ul>
        <li>Cursor Power User — IDE-integrated AI with real-time codebase context</li>
        <li>Claude Code Terminal Workflow — Autonomous agent in your terminal</li>
        <li>GitHub Copilot Classic — Inline completions and chat in VS Code</li>
        <li>Open-Source / Privacy-First — Local LLM, code never leaves your machine</li>
        <li>Production-Ready Startup — Cursor + full production toolchain</li>
      </ul>
    </noscript>
  </main>

  <footer class="site-footer">
    <span>Flowpicker — AI coding stack builder. Built by Amil.</span>

  <div id="auth-modal" class="auth-modal" hidden>
    <div class="auth-modal-backdrop"></div>
    <div class="auth-modal-panel"></div>
  </div>

  <script>window.App = { features: {} };</script>
  <script src="src/features/selections-store/selections-store.js"></script>

  <script src="src/features/browse-menu/browse-menu-preview.js"></script>
  <script src="src/features/auth/auth.js"></script>
  <script src="data/templates.js"></script>
  <script src="src/features/templates/templates.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      App.features.darkmode.init();
      if (window.TEMPLATES && window.TemplatesFeature) {
        window.TemplatesFeature.renderTemplates(window.TEMPLATES);
      } else {
        console.log('Debug: TEMPLATES =', window.TEMPLATES ? 'found' : 'missing');
        console.log('Debug: TemplatesFeature =', window.TemplatesFeature ? 'found' : 'missing');
      }
    });
  </script>
