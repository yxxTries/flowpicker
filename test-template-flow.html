<!DOCTYPE html>
<html>
<head>
  <title>Template Flow Test</title>
</head>
<body>
  <h1>Template Flow Test</h1>
  <p>This page tests the template → selection flow</p>

  <button id="test-btn">Test: Save Template Selections</button>
  <div id="output"></div>

  <script>
    const output = document.getElementById('output');

    document.getElementById('test-btn').addEventListener('click', () => {
      // Simulate what templates.js does
      const testTemplate = {
        id: 'test-cursor',
        name: 'Test Cursor',
        selections: {
          ide: [{ id: 'cursor', name: 'Cursor' }],
          llm: [{ id: 'claude-sonnet', name: 'Claude Sonnet 4.6' }],
          integration: [{ id: 'cursor-built', name: 'Cursor built-in' }],
          context: [{ id: 'cursor-cb', name: '@codebase (Cursor)' }],
          agent: [{ id: 'cursor-agent', name: 'Cursor Agent Mode' }],
        }
      };

      console.log('Saving template:', testTemplate.selections);
      localStorage.setItem('flowpicker-selections', JSON.stringify(testTemplate.selections));

      const saved = localStorage.getItem('flowpicker-selections');
      console.log('Saved to localStorage:', saved);

      const parsed = JSON.parse(saved || '{}');
      console.log('Parsed back:', parsed);

      output.innerHTML = `
        <h2>Result:</h2>
        <p><strong>Saved:</strong> ${saved ? 'YES' : 'NO'}</p>
        <p><strong>IDE:</strong> ${parsed.ide?.[0]?.name || 'MISSING'}</p>
        <p><strong>LLM:</strong> ${parsed.llm?.[0]?.name || 'MISSING'}</p>
        <p><strong>Integration:</strong> ${parsed.integration?.[0]?.name || 'MISSING'}</p>
        <p><strong>Context:</strong> ${parsed.context?.[0]?.name || 'MISSING'}</p>
        <p><strong>Agent:</strong> ${parsed.agent?.[0]?.name || 'MISSING'}</p>
        <p style="margin-top: 2rem;"><a href="index.html">Click here to navigate to Plan page →</a></p>
      `;
    });
  </script>
</body>
</html>
